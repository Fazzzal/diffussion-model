data:
  dataset: cifar10
  data_dir: data
  image_size: 32
  channels: 3

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.0002
  seed: 42

diffusion:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

model:
  base_channels: 64
  time_embedding_dim: 256
  checkpoint_name: cifar10_base64_unet.pth

paths:
  checkpoint_dir: checkpoints
  sample_dir: samples
  log_dir: logs

device: cuda